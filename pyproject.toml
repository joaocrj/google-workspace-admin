[project]
name = "google-workspace-admin"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "João Rocha", email = "joaocrj@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2.57.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.1.1",
    "requests>=2.34.2",
]

[project.scripts]
google-workspace-admin = "google_workspace_admin:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
